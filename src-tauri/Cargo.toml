[package]
name = "stronglylivingweekly"
version = "0.1.0"
description = "A private, local-first calendar for living each week deliberately"
authors = ["notananotheralt"]
license = "MIT"
repository = "https://github.com/notananotheralt/stronglylivingweekly"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stronglylivingweekly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
notify = "6.1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
